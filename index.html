<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Emilys Adventskalender</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --night:#13233a; --night2:#1d3557; --cream:#fff6e6; --paper:#fdf0d8;
  --red:#d6453d; --red-dark:#a8322c; --green:#3f7d5c; --gold:#f2b84b;
  --brown:#8a5a3b; --ink:#2b2118; --muted:#6f6052;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  min-height:100vh; background:radial-gradient(ellipse at top,var(--night2),var(--night) 70%);
  color:var(--cream); font-family:"Nunito",system-ui,sans-serif; overflow-x:hidden;
  -webkit-tap-highlight-color:transparent;
}
#snow{position:fixed;inset:0;pointer-events:none;z-index:0}
.wrap{position:relative;z-index:1;max-width:980px;margin:0 auto;padding:28px 16px 60px}
header{text-align:center;margin-bottom:22px}
header .mascot{width:92px;height:auto;display:block;margin:0 auto 6px}
h1{font-family:"Fredoka",sans-serif;font-weight:700;font-size:clamp(28px,7vw,48px);margin:0;line-height:1.1;color:var(--cream)}
h1 span{color:var(--gold)}
.sub{margin:8px auto 0;max-width:520px;color:#c9d4e3;font-size:15px}
.status{margin:14px auto 0;display:inline-block;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);
  padding:8px 14px;border-radius:999px;font-size:14px;color:#e8eef6}
.preview-badge{display:inline-block;margin-top:10px;background:var(--gold);color:var(--ink);font-weight:700;
  padding:4px 12px;border-radius:999px;font-size:13px}

/* grid */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;grid-auto-flow:dense}
@media(min-width:560px){.grid{grid-template-columns:repeat(4,1fr);gap:14px}}
@media(min-width:820px){.grid{grid-template-columns:repeat(6,1fr)}}
.door{
  position:relative;aspect-ratio:1/1;border:0;padding:0;cursor:pointer;background:none;perspective:700px;
  font:inherit;color:inherit;
}
.door.big{grid-column:span 2;grid-row:span 2}
.door .inner{position:absolute;inset:0;border-radius:14px;background:var(--paper);
  box-shadow:inset 0 0 0 3px rgba(0,0,0,.05),0 6px 0 rgba(0,0,0,.25);overflow:hidden;
  display:flex;align-items:center;justify-content:center;font-size:clamp(30px,9vw,46px)}
.door .leaf{
  position:absolute;inset:0;border-radius:14px;transform-origin:left center;transition:transform .7s cubic-bezier(.3,.7,.3,1);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  backface-visibility:hidden;box-shadow:0 6px 0 rgba(0,0,0,.25);
}
.door:nth-child(4n+1) .leaf{background:var(--red)}
.door:nth-child(4n+2) .leaf{background:var(--green)}
.door:nth-child(4n+3) .leaf{background:var(--brown)}
.door:nth-child(4n+4) .leaf{background:#2f6f8f}
.door .leaf::before{content:"";position:absolute;inset:6px;border:2px dashed rgba(255,255,255,.35);border-radius:10px}
.door .num{font-family:"Fredoka",sans-serif;font-weight:700;font-size:clamp(26px,7.5vw,40px);color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.2)}
.door.big .num{font-size:clamp(44px,14vw,72px)}
.door .lock{font-size:13px;opacity:.85}
.door.opened .leaf{transform:rotateY(-105deg)}
.door.locked{cursor:not-allowed}
.door.locked .leaf{filter:saturate(.75) brightness(.9)}
.door.today .leaf{animation:wiggle 2.4s ease-in-out infinite}
.door:focus-visible{outline:3px solid var(--gold);outline-offset:3px;border-radius:14px}
@keyframes wiggle{0%,86%,100%{transform:rotate(0)}90%{transform:rotate(-3deg)}94%{transform:rotate(3deg)}}
.door.shake .leaf{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

/* modal */
.backdrop{position:fixed;inset:0;background:rgba(8,14,26,.72);display:none;align-items:flex-end;justify-content:center;z-index:10;padding:0}
.backdrop.show{display:flex}
@media(min-width:560px){.backdrop{align-items:center;padding:20px}}
.modal{
  background:var(--cream);color:var(--ink);width:100%;max-width:520px;max-height:90vh;overflow-y:auto;
  border-radius:22px 22px 0 0;padding:26px 22px 28px;position:relative;animation:pop .35s ease;
  -webkit-overflow-scrolling:touch;
}
@media(min-width:560px){.modal{border-radius:22px}}
@keyframes pop{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
.close{position:absolute;top:10px;right:10px;width:44px;height:44px;border-radius:50%;border:0;background:rgba(0,0,0,.06);
  font-size:22px;cursor:pointer;color:var(--ink)}
.m-day{font-family:"Fredoka";font-weight:600;color:var(--red);font-size:14px;letter-spacing:.06em;text-transform:uppercase}
.m-icon{font-size:64px;line-height:1;margin:8px 0}
.m-icon svg{width:96px;height:auto}
.modal h2{font-family:"Fredoka";font-weight:700;margin:4px 0 10px;font-size:26px;line-height:1.15}
.modal p{font-size:17px;line-height:1.55;margin:0 0 12px}
.modal .small{font-size:14px;color:var(--muted)}
.modal ul,.modal ol{padding-left:22px;margin:0 0 12px;font-size:16px;line-height:1.6}
.coupon{border:3px dashed var(--red);border-radius:14px;padding:14px;text-align:center;background:#fff;margin:10px 0}
.coupon b{font-family:"Fredoka";font-size:20px;color:var(--red)}
.opts{display:grid;gap:8px;margin:10px 0}
.opt{min-height:48px;border-radius:12px;border:2px solid #e3d3b8;background:#fff;font:600 16px "Nunito";cursor:pointer;color:var(--ink);padding:8px 12px;text-align:left}
.opt:hover{border-color:var(--gold)}
.opt.right{background:#dff3e6;border-color:var(--green)}
.opt.wrong{background:#fbe1df;border-color:var(--red)}
.feedback{min-height:24px;font-weight:700;margin-top:6px}
.btn{display:inline-block;min-height:48px;padding:12px 20px;border-radius:12px;border:0;background:var(--red);color:#fff;font:700 16px "Nunito";cursor:pointer}
.btn:hover{background:var(--red-dark)}
.dogimg{width:100%;max-height:340px;object-fit:cover;border-radius:14px;background:#eee;display:block;margin:6px 0 10px}
.photo{width:100%;border-radius:14px;margin:6px 0 12px;display:block}
.sig{font-family:"Fredoka";font-weight:600;color:var(--red);margin-top:6px}
footer{text-align:center;margin-top:30px;color:#9fb0c6;font-size:13px}
body:not(.in) .wrap{display:none}
body.in .gate{display:none}
.gate{position:relative;z-index:1;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.gate-card{background:var(--cream);color:var(--ink);width:100%;max-width:360px;border-radius:22px;padding:26px 22px;text-align:center;box-shadow:0 10px 0 rgba(0,0,0,.25)}
.gate-card h1{color:var(--ink);font-size:30px}
.gate-card h1 span{color:var(--red)}
.gate-card svg{width:90px;height:auto;display:block;margin:0 auto 6px}
.gate-hint{color:var(--muted);margin:6px 0 12px}
.gate-card .btn{width:100%}
.gate-card.shake{animation:shake .4s}
.pwin{width:100%;min-height:48px;border-radius:12px;border:2px solid #e3d3b8;padding:10px 14px;font:16px "Nunito";margin:6px 0 12px;background:#fff;color:var(--ink)}
.preview-badge button{border:0;background:none;font:inherit;text-decoration:underline;cursor:pointer;color:inherit;padding:0 0 0 6px}

/* Gutscheine */
.layout{display:flex;flex-direction:column;gap:18px}
.coupons[hidden]{display:none}
.coupons{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.15);border-radius:18px;padding:12px 12px 14px}
.coupons h3{font-family:"Fredoka";font-weight:600;font-size:16px;margin:0 0 10px;color:var(--gold)}
.cp-list{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:2px}
.cp{flex:0 0 78%;max-width:260px;scroll-snap-align:start;background:var(--cream);color:var(--ink);border:2px dashed var(--red);border-radius:12px;padding:10px 12px}
.cp-t{font-family:"Fredoka";font-weight:600;color:var(--red);font-size:15px;line-height:1.25}
.cp-s{font-size:13px;line-height:1.4;margin-top:4px}
.cp-d{font-size:11px;color:var(--muted);margin-top:6px;text-transform:uppercase;letter-spacing:.05em}
@media(min-width:980px){
  .wrap{max-width:1200px}
  .layout{display:grid;grid-template-columns:1fr 260px;align-items:start;gap:24px}
  .layout .grid{grid-column:1;grid-row:1}
  .coupons{grid-column:2;grid-row:1;position:sticky;top:20px}
  .cp-list{flex-direction:column;overflow:visible}
  .cp{flex:none;max-width:none}
}
/* Türchen-Extras */
.opt{overflow-wrap:anywhere;hyphens:auto}
.wheel{font-family:"Fredoka";font-weight:600;font-size:22px;text-align:center;background:#fff;border:3px solid #e3d3b8;border-radius:16px;padding:22px 12px;margin:10px 0 12px;min-height:76px;overflow-wrap:anywhere}
.wheel.done{border-color:var(--gold);background:#fff8e1}
.calc{display:grid;grid-template-columns:1fr 70px 1fr;gap:8px}
.calc .pwin{margin:0 0 12px;padding:10px}
.rate{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:4px 0;font-size:16px}
.star{border:0;background:none;font-size:26px;color:var(--gold);cursor:pointer;padding:2px 3px;min-width:34px;min-height:40px}
.credit{font-size:11px;color:var(--muted);margin:-4px 0 10px}
textarea.pwin{resize:vertical;font-family:"Nunito"}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="snow" aria-hidden="true"></canvas>

<div class="gate" id="gate">
  <form class="gate-card" id="gateCard" autocomplete="off">
    <div id="gateMascot"></div>
    <h1>Psst&hellip; <span>Passwort?</span></h1>
    <p class="gate-hint">Nur für Emily.</p>
    <input id="gateIn" type="password" placeholder="Passwort" class="pwin" aria-label="Passwort">
    <button class="btn" type="submit">Reinlassen</button>
    <div class="feedback" id="gateFb"></div>
  </form>
</div>

<div class="wrap">
  <header>
    <svg class="mascot" viewBox="0 0 120 100" aria-hidden="true" id="wombatSvg">
      <!-- kleiner Wombat mit Mütze -->
      <ellipse cx="60" cy="68" rx="44" ry="28" fill="#8a6a50"/>
      <ellipse cx="60" cy="50" rx="30" ry="24" fill="#9c7a5c"/>
      <circle cx="36" cy="34" r="8" fill="#9c7a5c"/><circle cx="84" cy="34" r="8" fill="#9c7a5c"/>
      <circle cx="36" cy="34" r="4" fill="#d9a98a"/><circle cx="84" cy="34" r="4" fill="#d9a98a"/>
      <circle cx="49" cy="48" r="4" fill="#2b2118"/><circle cx="71" cy="48" r="4" fill="#2b2118"/>
      <circle cx="50" cy="47" r="1.3" fill="#fff"/><circle cx="72" cy="47" r="1.3" fill="#fff"/>
      <ellipse cx="60" cy="58" rx="10" ry="7" fill="#3b2c22"/>
      <ellipse cx="45" cy="58" rx="5" ry="3" fill="#e79a8f" opacity=".6"/><ellipse cx="75" cy="58" rx="5" ry="3" fill="#e79a8f" opacity=".6"/>
      <path d="M34 30 Q60 -6 88 30 Z" fill="#d6453d"/>
      <rect x="31" y="26" width="58" height="9" rx="4.5" fill="#fff6e6"/>
      <circle cx="62" cy="6" r="6" fill="#fff6e6"/>
      <ellipse cx="34" cy="92" rx="10" ry="5" fill="#6e523d"/><ellipse cx="86" cy="92" rx="10" ry="5" fill="#6e523d"/>
    </svg>
    <h1>Emilys <span>Adventskalender</span></h1>
    <div class="status" id="status"></div>
    <div id="previewBadge"></div>
  </header>

  <div class="layout">
    <aside class="coupons" id="coupons" hidden>
      <h3>🎟️ Deine Gutscheine</h3>
      <div class="cp-list" id="couponList"></div>
    </aside>
    <main class="grid" id="grid"></main>
  </div>

  <footer>Gebaut von Lilian &middot; Gilt als Mathe-Hausaufgabe: 24 Türchen zählen</footer>
</div>

<div class="backdrop" id="backdrop" role="dialog" aria-modal="true" aria-labelledby="mTitle">
  <div class="modal" id="modal">
    <button class="close" id="closeBtn" aria-label="Schließen">✕</button>
    <div id="mBody"></div>
  </div>
</div>

<script>
/* =====================================================================
   HIER KANNST DU ALLES ANPASSEN – ohne den Code darunter anzufassen.
   - ABSENDER: wie du unterschreibst
   - Jeder Tag: icon (Emoji), title, html (Text, darf <p>, <b>, <ul> usw.)
   - Optional: photo: "bilder/tag5.jpg"  (Bild in den Ordner "bilder" legen)
   - type: quiz, dog, gallery, wheel, calc, biker, trailer, rating, suggest
   - coupon: {title, text} -> landet in der Gutschein-Leiste
   - Stellen mit ✏️ solltest du persönlich ausfüllen!
   ===================================================================== */
const ABSENDER = "Lilian";
const JAHR = 2026;

const KAENGURU = [1,2,3,4,5,6].map(i=>"bilder/kaenguru"+i+".jpg");
const KAENGURU_C = ["SuperJew, CC BY-SA 3.0","SuperJew, CC BY-SA 3.0","SuperJew, CC BY-SA 3.0","825545, CC0","PublicDomainPictures, CC0","SuperJew, CC BY-SA 3.0"];

const KOALA = [1,2,3,4,5,6].map(i=>"bilder/koala"+i+".jpg");
const KOALA_C = ["Benjamint444, CC BY-SA 3.0","National Media Museum, gemeinfrei","Sanjay ach, CC BY-SA 3.0","Dinkum, CC0","Diliff, CC BY-SA 3.0","AggieNie, CC BY-SA 4.0"];

const TAGE = [
  { day:1, icon:"🐶", title:"Was ein Knuffi", type:"dog",
    html:`<p>Hund des Tages. Jedes Mal ein anderer, einfach nochmal drücken.</p>` },

  { day:2, icon:"wombat", title:"Darf ich vorstellen: Wally",
    html:`<p>Das ist <b>Wally, der Wombat</b>. Er passt den ganzen Dezember auf deine Türchen auf.</p>
          <p>Sein Job: keine Spinnen, keine Horrorfilme, kein Mike. Mike hat sich glaube ich trotzdem irgendwie reingehackt.</p>` },

  { day:3, icon:"🧮", title:"Training für die Mathearbeit", type:"quiz",
    question:"Kleines Aufwärmen für deinen ersten Schultag zuhause: Wie viel ist 7 + 8?",
    options:["13","15","Kommt drauf an","Ich ruf dich an und frag","Wer will meinen Untergang??"],
    answer:1,
    feedbacks:["Wie bitte????","Richtig! Mathe LK ist quasi sicher. 🎓","Worauf denn bitte???","Ich geh ran. Verraten tu ich's trotzdem nicht. 📞","Mike."] },

  { day:4, icon:"🍝", title:"Offizielle Lasagne-Bewertung",
    html:`<p><b>Lasagne von Emily</b></p>
          <ul>
            <li>Bewertung laut Emily: „Vielleicht so minimal besser“ als jede Lasagne im Internet</li>

            <li>Unabhängige Prüfung durch Lilian: <b>ausstehend</b></li>

  { day:5, icon:"🗣️", title:"Wer hat's gesagt?", type:"quiz",

  { day:6, icon:"🎅", title:"Nikolaus-Gutschein",
    coupon:{ title:"1× Film aussuchen", text:"Bitte wähl Horror aus." } },

  { day:7, icon:"🎡", title:"Glücksrad", type:"wheel",
    html:`<p>Keine Ahnung, was du heute machen sollst? Das Glücksrad entscheidet.</p>`,

  { day:10, icon:"🍿", title:"Emoji-Kino", type:"quiz",

    answer:0,
    feedbacks:["Richtig! Bär, Mantel, Orangenmarmelade, London. 🍊","Knapp. Da wär's ein Pferd. 🐴","Schön, dass du Interesse zeigst. Aber nein. 😏"] },

  { day:11, icon:"🚦", title:"Theorieprüfung", type:"quiz",

  { day:12, icon:"🔦", title:"Gute-Nacht-Kontrolle",

  { day:17, icon:"🏍️", title:"Dein Biker-Name", type:"biker",

  { day:18, icon:"🌙", title:"Gutschein",

  { day:19, icon:"🎬", title:"Neuer Trailer", type:"trailer",
    html:`<p>Ich hab einen Trailer für unseren Filmabend gefunden. Ist nur ganz kurz.</p>` },

  { day:20, icon:"📋", title:"Dein England-Zeugnis", type:"rating",
    html:`<p>Bevor's nach Hause geht: Bitte bewerte dein Auslandsjahr.</p>`,
    cats:["Wetter ☔","Essen 🍽️","Hunde 🐶","Schule 📚"] },

  { day:21, icon:"🕶️", title:"Mike stellt sich vor", from:"Mike 👋",
    html:`<p>Hi Emily, Mike hier. Wird Zeit, dass ich mich mal richtig vorstelle.</p>
          <ul>
            <li><b>Name:</b> Mike</li>
            <li><b>Alter:</b> unklar</li>
            <li><b>Wohnort:</b> Sprachnachrichten</li>
            <li><b>Hobbys:</b> nichts machen</li>
            <li><b>Kann man mich sehen?</b> Kommt drauf an</li>
            <li><b>Lieblingsessen:</b> deine Lasagne (noch nicht probiert, aber viel gehört)</li>
          </ul>
          <p>Ich mach nichts. Ich bin nen super Typ. Grüß Wally von mir.</p>` },

  { day:22, icon:"🎥", title:"Was Entspannteres", type:"suggest",
    html:`<p>Du darfst den Film aussuchen. Schreib hier deine Vorschläge rein:</p>` },

  { day:23, icon:"🎄", title:"Fast geschafft",
    html:`<p>Morgen ist Heiligabend! Die Bilanz:</p>
          <ul>
            <li>Gesehene Hunde: unendlich</li>
            <li>Gelöste Matheaufgaben: 1 (mit Taschenrechner)</li>
            <li>Gesichtete Spinnen: 0 ✅</li>
            <li>Gesehene Horrorfilme: 0 (noch 😏)</li>
            <li>Probierte Lasagne: 0 (muss sich ändern)</li>
            <li>Mike-Sichtungen: zu viele</li>
          </ul>` },

  { day:24, icon:"🎁", title:"Frohe Weihnachten, Emily!", big:true,
    html:`<p>24 Türchen, 0 Spinnen, ungefähr eine gelöste Matheaufgabe.</p>
          <p>Ich hoffe, der Kalender hat dir den Dezember ein bisschen versüßt.</p>
          <p>Schön, dass du wieder da bist. Jetzt kann die Lasagne-Prüfung ja endlich stattfinden. 🍝</p>
          <p>Frohe Weihnachten! 🎄</p>
          <p class="small">PS: Mike lässt grüßen.</p>` },
];

/* ======================= AB HIER: CODE ======================= */
(function(){
  // LOGIN: Beim Öffnen kommt ein Passwortfeld.
  //  - Emilys Passwort -> normaler Kalender (Groß/Kleinschreibung egal)
  //  - Test-Passwort   -> Testmodus, alle Türchen offen
  // Hier stehen nur SHA-256-Hashes, nicht die Passwörter selbst.
  const EMILY_HASH = "d7b8988f8fd2edbd7c5a63ff60009a39f9cc9546f2ca1a5e8eafea8e2f2fa97b";
  const PW_HASH    = "22825e94390e6d4855af965afa3f27e4cd90f7ef8010f3a45904a1008fcdd247";
  const ADMIN_KEY = "advent-test-v2", LOGIN_KEY = "advent-login-v2";
  try{ localStorage.removeItem("advent-testmodus"); localStorage.removeItem("advent-login"); }catch(e){}
  let PREVIEW = false, LOGGED = false;
  try{
    PREVIEW = localStorage.getItem(ADMIN_KEY) === PW_HASH;
    LOGGED = PREVIEW || localStorage.getItem(LOGIN_KEY) === EMILY_HASH;
  }catch(e){}
  async function sha256(s){
    const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s));
    return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,"0")).join("");
  }
  if (LOGGED) document.body.classList.add("in");
  else setTimeout(()=>{ try{ document.getElementById("gateIn").focus(); }catch(e){} }, 100);
  document.getElementById("gateCard").addEventListener("submit", async e=>{
    e.preventDefault();
    const fb = document.getElementById("gateFb");
    const val = document.getElementById("gateIn").value;
    let hAdmin = "", hEmily = "";
    try{ hAdmin = await sha256(val); hEmily = await sha256(val.trim().toLowerCase()); }
    catch(err){ fb.textContent = "Das geht in diesem Browser leider nicht."; return; }
    if (hAdmin === PW_HASH){
      try{ localStorage.setItem(ADMIN_KEY, hAdmin); }catch(err){}
      location.reload();
    } else if (hEmily === EMILY_HASH){
      try{ localStorage.setItem(LOGIN_KEY, hEmily); }catch(err){}
      document.body.classList.add("in");
    } else {
      fb.textContent = "Falsches Passwort 🐾";
      const g = document.getElementById("gateCard");
      g.classList.remove("shake"); void g.offsetWidth; g.classList.add("shake");
    }
  });

  // Im Testmodus: ?datum=2026-12-15 simuliert ein Datum
  const params = new URLSearchParams(location.search);
  let NOW = new Date();
  const d = PREVIEW && params.get("datum");
  if (d && /^\d{4}-\d{2}-\d{2}$/.test(d)) NOW = new Date(d + "T12:00:00");

  // Datum in englischer Zeit (Emily ist in Paignton)
  function londonParts(date){
    try{
      const f = new Intl.DateTimeFormat("en-GB",{timeZone:"Europe/London",year:"numeric",month:"2-digit",day:"2-digit"});
      const p = Object.fromEntries(f.formatToParts(date).map(x=>[x.type,x.value]));
      return {y:+p.year,m:+p.month,d:+p.day};
    }catch(e){ return {y:date.getFullYear(),m:date.getMonth()+1,d:date.getDate()}; }
  }
  const t = londonParts(NOW);
  const todayNum = t.y*10000 + t.m*100 + t.d;
  const doorNum = n => JAHR*10000 + 1200 + n;
  const isOpenable = n => PREVIEW || todayNum >= doorNum(n);
  const isToday = n => todayNum === doorNum(n);

  // gespeicherte geöffnete Türchen
  const KEY = "emily-advent-" + JAHR;
  let opened = {};
  try{ opened = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; }catch(e){ opened = {}; }
  function save(){ try{ localStorage.setItem(KEY, JSON.stringify(opened)); }catch(e){} }

  const WOMBAT = document.getElementById("wombatSvg").outerHTML.replace('class="mascot"','').replace('id="wombatSvg"','');
  document.getElementById("gateMascot").innerHTML = WOMBAT;

  // Easter Egg: Wombat oben antippen
  const WALLY_SAYS = ["Ich bin Wally. Nicht Mike. 🐾","Mike??? Kenn ich nicht.","Okay, vielleicht kenn ich Mike.","Mike macht nichts. Ist nen super Typ."];
  let wallyN = 0, wallyT = null;
  const mascot = document.getElementById("wombatSvg");
  mascot.style.cursor = "pointer";
  mascot.addEventListener("click", ()=>{
    const st = document.getElementById("status"), old = st.dataset.orig || st.textContent;
    st.dataset.orig = old;
    st.textContent = WALLY_SAYS[wallyN++ % WALLY_SAYS.length];
    clearTimeout(wallyT);
    wallyT = setTimeout(()=>{ st.textContent = st.dataset.orig; delete st.dataset.orig; }, 2500);
  });
  const iconHTML = ic => ic === "wombat" ? WOMBAT : ic;

  // Status
  const status = document.getElementById("status");
  if (PREVIEW){
    document.getElementById("previewBadge").innerHTML = '<span class="preview-badge">Testmodus: alle Türchen offen<button id="logout">beenden</button></span>';
    document.getElementById("logout").addEventListener("click", ()=>{
      try{ localStorage.removeItem(ADMIN_KEY); localStorage.removeItem(LOGIN_KEY); localStorage.removeItem(KEY); }catch(e){}
      location.href = location.pathname;
    });
  }
  if (todayNum < doorNum(1)){
    const start = Date.UTC(JAHR,11,1), nowUtc = Date.UTC(t.y,t.m-1,t.d);
    const days = Math.round((start - nowUtc)/86400000);
    status.textContent = days === 1 ? "Morgen geht's los! 🎄" : `Noch ${days} Tage bis zum ersten Türchen 🎄`;
  } else if (todayNum > doorNum(24)){
    status.textContent = "Frohe Weihnachten! Alle Türchen sind offen 🎁";
  } else {
    status.textContent = `Heute ist Türchen ${t.d} dran ✨`;
  }

  // Türchen in gemischter Reihenfolge (fest, nicht zufällig)
  const ORDER = [7,1,18,12,3,22,9,15,24,5,20,11,2,16,8,13,19,4,23,10,6,17,14,21];
  const grid = document.getElementById("grid");
  ORDER.forEach(n=>{
    const day = TAGE.find(x=>x.day===n); if(!day) return;
    const b = document.createElement("button");
    b.className = "door" + (day.big ? " big" : "");
    b.setAttribute("aria-label", "Türchen " + n);
    const can = isOpenable(n);
    if (!can) b.classList.add("locked");
    if (isToday(n) && !opened[n]) b.classList.add("today");
    if (opened[n] && can) b.classList.add("opened");
    b.innerHTML = `<div class="inner">${day.icon==="wombat" ? "🐾" : day.icon}</div>
      <div class="leaf"><span class="num">${n}</span>${can ? "" : '<span class="lock">🔒</span>'}</div>`;
    b.addEventListener("click", ()=>{
      if (!isOpenable(n)){
        b.classList.remove("shake"); void b.offsetWidth; b.classList.add("shake");
        const left = Math.round((Date.UTC(JAHR,11,n) - Date.UTC(t.y,t.m-1,t.d))/86400000);
        status.textContent = `Geduld! Türchen ${n} geht erst in ${left} ${left===1?"Tag":"Tagen"} auf 😏`;
        return;
      }
      const first = !opened[n];
      opened[n] = true; save();
      b.classList.remove("today"); b.classList.add("opened");
      setTimeout(()=>openModal(day), first ? 550 : 0);
    });
    grid.appendChild(b);
  });

  // Modal
  const backdrop = document.getElementById("backdrop");
  const body = document.getElementById("mBody");
  let lastFocus = null;
  // Gutscheine (rechts neben dem Kalender, am Handy oben drüber)
  const couponList = document.getElementById("couponList"), couponBox = document.getElementById("coupons");
  function couponHTML(c){ return `<div class="coupon"><b>GUTSCHEIN</b><br>${c.title}<br><span class="small">${c.text}</span></div>`; }
  function renderCoupons(){
    const got = TAGE.filter(x=>x.coupon && opened[x.day] && isOpenable(x.day));
    couponBox.hidden = !got.length;
    couponList.innerHTML = got.map(x=>`<div class="cp"><div class="cp-t">${x.coupon.title}</div><div class="cp-s">${x.coupon.text}</div><div class="cp-d">Türchen ${x.day}</div></div>`).join("");
  }
  renderCoupons();

  const pick = a => a[Math.floor(Math.random()*a.length)];
  const esc = s => s.replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

  function openModal(day){
    lastFocus = document.activeElement;
    let h = `<div class="m-day">${day.day}. Dezember</div>
             <div class="m-icon">${iconHTML(day.icon)}</div>
             <h2 id="mTitle">${day.title}</h2>`;
    if (day.photo) h += `<img class="photo" src="${day.photo}" alt="" onerror="this.remove()">`;
    if (day.html) h += day.html;
    if (day.coupon) h += couponHTML(day.coupon) + `<p class="small">Liegt ab jetzt bei deinen Gutscheinen.</p>`;
    const T = day.type;
    if (T === "quiz"){
      h += `<p><b>${day.question}</b></p><div class="opts">` +
           day.options.map((o,i)=>`<button class="opt" data-i="${i}">${o}</button>`).join("") +
           `</div><div class="feedback" id="fb"></div>`;
    }
    if (T === "dog"){
      h += `<div id="dogbox"></div>
            <p id="dogfail" class="small" style="display:none">Der Hund ist gerade Gassi. 🐕 Versuch's gleich nochmal!</p>
            <button class="btn" id="dogbtn">Noch ein Hund! 🐶</button>`;
    }
    if (T === "gallery"){
      h += `<div id="galbox"></div><button class="btn" id="galbtn">${day.button}</button>`;
    }
    if (T === "wheel"){
      h += `<div class="wheel" id="wheel">?</div><button class="btn" id="wheelbtn">Drehen 🎡</button>`;
    }
    if (T === "calc"){
      h += `<div class="calc">
              <input id="ca" type="number" inputmode="decimal" class="pwin" placeholder="Zahl 1">
              <select id="cop" class="pwin"><option>+</option><option>−</option><option>×</option><option>÷</option></select>
              <input id="cb" type="number" inputmode="decimal" class="pwin" placeholder="Zahl 2">
            </div>
            <button class="btn" id="cbtn">Ausrechnen</button>
            <div class="feedback" id="cres"></div>`;
    }
    if (T === "biker"){
      h += `<div class="wheel" id="biker">Emily „…“</div><button class="btn" id="bikerbtn">Namen geben 🏍️</button>`;
    }
    if (T === "trailer"){
      h += `<div id="trbox"><p id="trtxt"></p><button class="btn" id="trbtn">Trailer ansehen ▶️</button></div>`;
    }
    if (T === "rating"){
      h += day.cats.map((c,i)=>`<div class="rate"><span>${c}</span><span class="stars" data-c="${i}">` +
             [1,2,3,4,5].map(s=>`<button class="star" data-s="${s}" aria-label="${s} Sterne">☆</button>`).join("") +
           `</span></div>`).join("") +
           `<button class="btn" id="ratebtn">Zeugnis abschicken</button><div class="feedback" id="ratefb"></div>`;
    }
    if (T === "suggest"){
      h += `<textarea id="sugg" class="pwin" rows="4" placeholder="Meine Filmvorschläge…"></textarea>
            <button class="btn" id="suggbtn">Abschicken</button><div class="feedback" id="suggfb"></div>`;
    }
    h += `<p class="sig">– ${day.from || ABSENDER}</p>`;
    body.innerHTML = h;
    backdrop.classList.add("show");
    document.body.style.overflow = "hidden";
    document.getElementById("modal").scrollTop = 0;
    document.getElementById("closeBtn").focus();
    if (day.coupon) renderCoupons();
    const $ = id => document.getElementById(id);

    if (T === "quiz"){
      const fb = $("fb");
      body.querySelectorAll(".opt").forEach(btn=>btn.addEventListener("click",()=>{
        const i = +btn.dataset.i, ok = i===day.answer;
        body.querySelectorAll(".opt").forEach(x=>x.classList.remove("right","wrong"));
        btn.classList.add(ok ? "right" : "wrong");
        fb.textContent = day.feedbacks ? day.feedbacks[i] : (ok ? day.right : day.wrong);
        if (ok) confetti();
      }));
    }
    if (T === "dog"){
      const img = new Image(), fail = $("dogfail");
      img.className = "dogimg"; img.alt = "Ein zufälliger Hund"; img.style.display = "none";
      $("dogbox").appendChild(img);
      const load = ()=>{
        fail.style.display="none";
        fetch("https://dog.ceo/api/breeds/image/random")
          .then(r=>r.json()).then(j=>{ if(j && j.message){ img.style.display="block"; img.src=j.message; } else throw 0; })
          .catch(()=>{ img.style.display="none"; fail.style.display="block"; });
      };
      img.onerror = ()=>{ img.style.display="none"; fail.style.display="block"; };
      $("dogbtn").addEventListener("click", load);
      load();
    }
    if (T === "gallery"){
      const img = new Image(); img.className = "dogimg"; img.alt = day.title;
      $("galbox").appendChild(img);
      let i = Math.floor(Math.random()*day.images.length);
      const show = ()=>{ img.src = day.images[i]; };
      $("galbtn").addEventListener("click", ()=>{ i = (i+1) % day.images.length; show(); });
      show();
    }
    if (T === "wheel"){
      const w = $("wheel"); let spinning = false;
      $("wheelbtn").addEventListener("click", ()=>{
        if (spinning) return; spinning = true; w.classList.remove("done");
        let n = 0, delay = 50, idx = Math.floor(Math.random()*day.options.length);
        const total = 18 + Math.floor(Math.random()*day.options.length);
        const step = ()=>{
          idx = (idx+1) % day.options.length; w.textContent = day.options[idx]; n++;
          if (n < total){ delay *= 1.12; setTimeout(step, delay); }
          else { spinning = false; w.classList.add("done"); confetti(); }
        };
        step();
      });
    }
    if (T === "calc"){
      const quips = ["Gern geschehen.","Mike hat mitgerechnet.","In der Arbeit darfst du den leider nicht benutzen.","Hätte ich dir auch am Telefon sagen können."];
      $("cbtn").addEventListener("click", ()=>{
        const a = parseFloat($("ca").value), b = parseFloat($("cb").value), op = $("cop").value, r = $("cres");
        if (isNaN(a) || isNaN(b)){ r.textContent = "Da fehlt noch eine Zahl. Wie bitte????"; return; }
        if (op === "÷" && b === 0){ r.textContent = "Durch 0? Nicht mal Mike kann das."; return; }
        let x = op==="+" ? a+b : op==="−" ? a-b : op==="×" ? a*b : a/b;
        x = Math.round(x*1000)/1000;
        r.textContent = `= ${String(x).replace(".",",")}. ${pick(quips)}`;
      });
    }
    if (T === "biker"){
      const A = ["Turbo","Donner","Midnight","Stahl","Knuffi","Wilde","Blitz","Vollgas"];
      const B = ["Wombat","Joey","Quokka","Lasagne","Koala","Badewanne","Gummibärchen","Mike"];
      $("bikerbtn").addEventListener("click", ()=>{ $("biker").textContent = `Emily „${pick(A)}-${pick(B)}“`; $("biker").classList.add("done"); });
    }
    if (T === "trailer"){
      const steps = [
        ["Bist du sicher? Der ist schon ziemlich heftig.","Ja, zeig her"],
        ["Wirklich? Letzte Chance…","Okay, los"],
      ];
      let s = 0;
      $("trbtn").addEventListener("click", ()=>{
        if (s < steps.length){ $("trtxt").textContent = steps[s][0]; $("trbtn").textContent = steps[s][1]; s++; return; }
        $("trbox").innerHTML = `<p><b>Der gruseligste Trailer des Jahres:</b></p><div id="trimg"></div><p class="small" id="trfail" style="display:none">Der Welpe schläft gerade. Stell ihn dir einfach vor. 🐶</p>`;
        const img = new Image(); img.className = "dogimg"; img.alt = "Ein Hund"; img.style.display = "none";
        $("trimg").appendChild(img);
        img.onerror = ()=>{ img.style.display="none"; $("trfail").style.display="block"; };
        fetch("https://dog.ceo/api/breeds/image/random")
          .then(r=>r.json()).then(j=>{ img.src=j.message; img.style.display="block"; })
          .catch(()=>{ $("trfail").style.display="block"; });
      });
    }
    if (T === "rating"){
      const vals = {};
      body.querySelectorAll(".stars").forEach(row=>{
        row.querySelectorAll(".star").forEach(st=>st.addEventListener("click", ()=>{
          const v = +st.dataset.s; vals[row.dataset.c] = v;
          row.querySelectorAll(".star").forEach(x=>x.textContent = (+x.dataset.s <= v) ? "★" : "☆");
        }));
      });
      $("ratebtn").addEventListener("click", ()=>{
        const n = Object.keys(vals).length;
        if (n < day.cats.length){ $("ratefb").textContent = "Erst alles bewerten. Das ist ein offizielles Dokument."; return; }
        const avg = Object.values(vals).reduce((a,b)=>a+b,0)/n;
        $("ratefb").textContent = `Gesamtnote: ${avg.toFixed(1).replace(".",",")} ⭐. Danke für dein Feedback, es wurde an Mike weitergeleitet.`;
        confetti();
      });
    }
    if (T === "suggest"){
      $("suggbtn").addEventListener("click", ()=>{
        $("suggfb").textContent = "Kann eh nicht sehen, was du hier eingibst. Wir gucken einfach nen Horrorfilm. 😌";
      });
    }
    if (day.day === 24) confetti(true);
  }
  function closeModal(){
    backdrop.classList.remove("show");
    document.body.style.overflow = "";
    if (lastFocus) lastFocus.focus();
  }
  document.getElementById("closeBtn").addEventListener("click", closeModal);
  backdrop.addEventListener("click", e=>{ if(e.target===backdrop) closeModal(); });
  document.addEventListener("keydown", e=>{ if(e.key==="Escape" && backdrop.classList.contains("show")) closeModal(); });

  // Schnee + Konfetti
  const cv = document.getElementById("snow"), cx = cv.getContext("2d");
  let W, H, flakes = [], bits = [];
  const reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  function resize(){ W = cv.width = innerWidth; H = cv.height = innerHeight; }
  resize(); addEventListener("resize", resize);
  const count = reduce ? 0 : Math.min(90, Math.round(innerWidth/9));
  for (let i=0;i<count;i++) flakes.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*2.4+0.8,s:Math.random()*0.6+0.3,w:Math.random()*Math.PI*2});
  function confetti(big){
    if (reduce) return;
    const cols = ["#d6453d","#f2b84b","#3f7d5c","#fff6e6","#2f6f8f"];
    for (let i=0;i<(big?180:70);i++) bits.push({x:W/2,y:H*0.45,vx:(Math.random()-.5)*12,vy:Math.random()*-11-3,
      c:cols[i%cols.length],r:Math.random()*5+3,life:120+Math.random()*60,rot:Math.random()*6});
    cv.style.zIndex = 20;
  }
  function tick(){
    cx.clearRect(0,0,W,H);
    cx.fillStyle = "rgba(255,255,255,.8)";
    for (const f of flakes){
      f.y += f.s; f.w += 0.01; f.x += Math.sin(f.w)*0.4;
      if (f.y > H+5){ f.y = -5; f.x = Math.random()*W; }
      cx.beginPath(); cx.arc(f.x,f.y,f.r,0,Math.PI*2); cx.fill();
    }
    for (const b of bits){
      b.vy += 0.3; b.x += b.vx; b.y += b.vy; b.life--; b.rot += 0.1;
      cx.save(); cx.translate(b.x,b.y); cx.rotate(b.rot); cx.fillStyle=b.c; cx.fillRect(-b.r/2,-b.r/2,b.r,b.r*1.6); cx.restore();
    }
    bits = bits.filter(b=>b.life>0 && b.y<H+20);
    if (!bits.length) cv.style.zIndex = 0;
    requestAnimationFrame(tick);
  }
  if (!reduce) tick();
})();
</script>
